<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GitHub Profile</title>
</head>

<body>

    <h1>{{ user.name }}</h1>

    <p>Username: {{ user.username }}</p>

    <p>Followers: {{ user.followers_count }}</p>

    <img src="{{ user.avatar_url }}" alt="GitHub Avatar">

</body>
</html>
